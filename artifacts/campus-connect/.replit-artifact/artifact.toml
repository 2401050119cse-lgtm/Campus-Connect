kind = "web"
previewPath = "/"
title = "CampusConnect"
description = "A verified campus information platform where students discover and search events, deadlines, academic notices and placement opportunities, with registrations, bookmarks, notifications and calendar tracking. Faculty submit updates for administrator approval."
version = "1.0.0"
id = "artifacts/campus-connect"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19048

[services.development]
run = "pnpm --filter @workspace/campus-connect run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/campus-connect", "run", "build" ]
serve = "static"
publicDir = "artifacts/campus-connect/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19048"
BASE_PATH = "/"
